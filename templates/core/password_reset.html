{% extends 'base.html' %}
{% block content %}
<div class="card shadow-sm p-4" style="font: bolder; background: silver; border-radius: 1rem; border-color: black; text-align: center;">
  <h2 class="mb-3">Reset Password</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-warning w-100">Send Reset Link</button>
  </form>
</div>
{% endblock %}
