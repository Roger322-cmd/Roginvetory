{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>Your trackers (max {{ limit }})</h3>
  <a href="{% url 'tracker_create' %}" class="btn btn-primary">Create tracker</a>
</div>

<div class="row">
  {% for t in trackers %}
    <div class="col-md-4">
      <div class="card mb-3 shadow-sm">
        <div class="card-body">
          <h5 class="card-title">{{ t.name }}</h5>
          <a class="btn btn-outline-dark btn-sm" href="{% url 'inventory' t.id %}">Inventory</a>
          <a class="btn btn-outline-success btn-sm" href="{% url 'sell_product' t.id %}">Sell</a>
          <a class="btn btn-outline-secondary btn-sm" href="{% url 'sales_records' t.id %}">Sales</a>
          <a class="btn btn-outline-primary btn-sm" href="{% url 'dashboard' t.id %}">Dashboard</a>
        </div>
      </div>
    </div>
  {% empty %}
    <p>No trackers yet. Create one.</p>
  {% endfor %}
</div>
{% endblock %}
